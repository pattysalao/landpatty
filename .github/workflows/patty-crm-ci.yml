name: Patty CRM - syntax and regression checks
on:
  push:
    branches:
      - main
      - feature/patty-agenda-retencao-20261103
      - fix/patty-retention-validation-20261103
  pull_request:
    paths:
      - "api/**"
      - "lib/**"
      - "crm*.html"
      - "patty-*.js"
      - "index.html"
      - "scripts/*.mjs"
      - ".github/workflows/patty-crm-ci.yml"
      - "package.json"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check CRM JavaScript syntax
        run: node scripts/check-crm-syntax.mjs
      - name: Test Gendo historical import integrity
        run: node scripts/test-gendo-archive.mjs
      - name: Validate appointment API syntax
        run: node --check api/crm/appointments.js
      - name: Test concurrent appointment reservations and blocks
        run: node scripts/test-appointments-concurrency.mjs
      - name: Test retention and consent protections
        if: ${{ hashFiles('scripts/test-retention.mjs') != '' }}
        run: node scripts/test-retention.mjs
