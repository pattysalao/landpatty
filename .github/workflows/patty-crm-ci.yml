name: Patty CRM - complete regression suite
on:
  push:
    branches:
      - main
      - release/patty-crm-20261104-integrated
  pull_request:
    paths:
      - "api/**"
      - "lib/**"
      - "crm*.html"
      - "patty-*.js"
      - "index.html"
      - "scripts/*.mjs"
      - ".github/workflows/patty-crm-ci.yml"
      - "package.json"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full JavaScript syntax checks
        run: node scripts/check-crm-syntax.mjs
      - name: Protect loading, ordering, catalog pages and sessions
        run: node scripts/test-crm-loading.mjs
      - name: Protect Gendo import integrity
        run: node scripts/test-gendo-archive.mjs
      - name: Prevent double bookings
        run: node scripts/test-appointments-concurrency.mjs
      - name: Validate exact service identities
        run: node scripts/test-agenda-services.mjs
      - name: Test resumable customer search index
        run: node scripts/test-customer-index.mjs
      - name: Preserve retention and consent records
        run: node scripts/test-retention.mjs
      - name: Verify confirmed form_submit and safe conversion counting
        run: node scripts/test-form-submit.mjs
